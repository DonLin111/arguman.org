{% extends "base.html" %}

{% block content %}
<div class="container about content">
    <h1>We could not find this page.</h1>

        However, we can still help you find what you are looking for.
    </p>

    <form action="{% url "contentions_search" %}" class="search-form" style="padding: 0px">
        <label for="id_q">Key words: </label>
        <input type="text" class="searchfield" style="width: 370px" name="keywords" />
        </br></br>
        <a href="{{ request.get_full_path }}" class="submit">Try Again</a> |
        <a href='{% url "home" %}' class="submit">Return to Home Page</a>
    </form>
</div>
{% endblock %}
